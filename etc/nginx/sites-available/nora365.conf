# /etc/nginx/sites-available/nora365.conf
# NORA PLATFORM - FRONTEND / API / MOBILE / CDN / WEBSOCKET / PRODUCTION DIST

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream nora_api {
    server 127.0.0.1:10000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name nora365.co.kr www.nora365.co.kr api.nora365.co.kr m.nora365.co.kr cdn.nora365.co.kr;

    client_max_body_size 20m;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    location / {
        if ($host = www.nora365.co.kr) {
            return 301 https://nora365.co.kr$request_uri;
        }

        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.nora365.co.kr;

    client_max_body_size 20m;

    ssl_certificate /etc/letsencrypt/live/nora365.co.kr-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nora365.co.kr-0001/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /ws {
        proxy_pass http://nora_api;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400;
        proxy_send_timeout 86400;

        proxy_buffering off;
    }

    location /socket.io/ {
        proxy_pass http://nora_api;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400;
        proxy_send_timeout 86400;

        proxy_buffering off;
    }

    location /uploads/ {
        proxy_pass http://nora_api/uploads/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        expires 30d;

        add_header Cache-Control "public, max-age=2592000";
    }

    location /api/uploads/ {
        proxy_pass http://nora_api/api/uploads/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        expires 30d;

        add_header Cache-Control "public, max-age=2592000";
    }

    location = /api {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "$http_origin" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, Origin, X-Requested-With" always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }

        return 301 /api/;
    }

    location /api/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "$http_origin" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, Origin, X-Requested-With" always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }

        proxy_pass http://nora_api/api/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location ~* /(vendor|phpunit|eval-stdin|hello\.world|\.env|\.git|wp-admin|wp-login|xmlrpc\.php|actuator|robots\.txt|sitemap\.xml|security\.txt) {
        return 404;
    }

    location / {
        proxy_pass http://nora_api;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name cdn.nora365.co.kr;

    client_max_body_size 20m;

    ssl_certificate /etc/letsencrypt/live/nora365.co.kr-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nora365.co.kr-0001/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Access-Control-Allow-Origin "*" always;

    location /uploads/ {
        proxy_pass http://nora_api/uploads/;
        proxy_http_version 1.1;

        proxy_set_header Host api.nora365.co.kr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        expires 30d;

        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location /api/uploads/ {
        proxy_pass http://nora_api/api/uploads/;
        proxy_http_version 1.1;

        proxy_set_header Host api.nora365.co.kr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        expires 30d;

        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location ~* /(vendor|phpunit|eval-stdin|hello\.world|\.env|\.git|wp-admin|wp-login|xmlrpc\.php|actuator|robots\.txt|sitemap\.xml|security\.txt) {
        return 404;
    }

    location / {
        proxy_pass http://nora_api/uploads/;
        proxy_http_version 1.1;

        proxy_set_header Host api.nora365.co.kr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        expires 30d;

        add_header Cache-Control "public, max-age=2592000, immutable";
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name nora365.co.kr www.nora365.co.kr m.nora365.co.kr;

    if ($host = www.nora365.co.kr) {
        return 301 https://nora365.co.kr$request_uri;
    }

    root /home/ubuntu/noma-project/client/dist;
    index index.html;

    client_max_body_size 20m;

    ssl_certificate /etc/letsencrypt/live/nora365.co.kr-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nora365.co.kr-0001/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /ws {
        proxy_pass http://nora_api;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host api.nora365.co.kr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400;
        proxy_send_timeout 86400;

        proxy_buffering off;
    }

    location /socket.io/ {
        proxy_pass http://nora_api;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host api.nora365.co.kr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400;
        proxy_send_timeout 86400;

        proxy_buffering off;
    }

    location = /api {
        return 301 /api/;
    }

    location /api/ {
        proxy_pass http://nora_api/api/;
        proxy_http_version 1.1;

        proxy_set_header Host api.nora365.co.kr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /uploads/ {
        proxy_pass http://nora_api/uploads/;
        proxy_http_version 1.1;

        proxy_set_header Host api.nora365.co.kr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        expires 30d;

        add_header Cache-Control "public, max-age=2592000";
    }

    location ~* /(vendor|phpunit|eval-stdin|hello\.world|\.env|\.git|wp-admin|wp-login|xmlrpc\.php|actuator|robots\.txt|sitemap\.xml|security\.txt) {
        return 404;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|ttf|eot|map)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }
}