services:
  app:
    container_name: nora_app
    build: .
    restart: always

    ports:
      - "10000:10000"

    env_file:
      - .env.production

    environment:
      NODE_ENV: production
      PORT: 10000
      HOST: 0.0.0.0
      TZ: Asia/Seoul
      SERVER_NAME: nora-platform
      SERVER_HOST: https://api.nora365.co.kr
      PUBLIC_SERVER_HOST: https://api.nora365.co.kr
      CLIENT_URL: https://www.nora365.co.kr
      ADMIN_URL: https://www.nora365.co.kr/admin
      MOBILE_URL: https://m.nora365.co.kr
      CDN_URL: https://cdn.nora365.co.kr
      API_BASE_URL: https://api.nora365.co.kr/api
      CORS_ORIGIN: https://nora365.co.kr,https://www.nora365.co.kr,https://m.nora365.co.kr,https://api.nora365.co.kr,https://cdn.nora365.co.kr,http://localhost:5173,http://127.0.0.1:5173
      SOCKET_ENABLED: "true"
      SOCKET_PATH: /ws
      CACHE_ENABLED: "true"
      CACHE_TTL: 300
      TRUST_PROXY_HOPS: 1
      MONGOOSE_AUTO_INDEX: "false"
      MONGOOSE_AUTO_CREATE: "false"
      SYSTEM_ID: nora-core
      INSTANCE_ID: production-01

    volumes:
      - ./logs:/app/logs
      - ./uploads:/app/uploads

    networks:
      - nora_network

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:10000/api/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s

    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  redis:
    container_name: nora_redis
    image: redis:7-alpine
    restart: always

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru

    networks:
      - nora_network

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 5s

networks:
  nora_network:
    driver: bridge

volumes:
  redis_data: