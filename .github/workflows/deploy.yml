name: Capture NORA365 Live Bundle

on:
  push:
    branches:
      - main

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate Secrets
        run: |
          test -n "${{ secrets.HOST }}"
          test -n "${{ secrets.USERNAME }}"
          test -n "${{ secrets.SSH_KEY }}"
          test -n "${{ secrets.PORT }}"
      - name: Capture current production bundle
        shell: bash
        run: |
          set -e
          mkdir -p ~/.ssh capture
          printf '%s\n' "${{ secrets.SSH_KEY }}" > ~/.ssh/nora_deploy_key
          chmod 600 ~/.ssh/nora_deploy_key
          SCP_OPTS=(-o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -i ~/.ssh/nora_deploy_key -P "${{ secrets.PORT }}")
          REMOTE="${{ secrets.USERNAME }}@${{ secrets.HOST }}"
          scp "${SCP_OPTS[@]}" "$REMOTE:/var/www/nora/index.html" capture/index.html
          ASSET=$(grep -o 'assets/index-[^" ]*\.js' capture/index.html | head -1)
          test -n "$ASSET"
          echo "ASSET=$ASSET"
          scp "${SCP_OPTS[@]}" "$REMOTE:/var/www/nora/$ASSET" capture/current-live.js
          sha256sum capture/index.html capture/current-live.js
          rm -f ~/.ssh/nora_deploy_key
      - name: Upload capture artifact
        uses: actions/upload-artifact@v4
        with:
          name: nora-live-bundle
          path: capture/
          if-no-files-found: error
          retention-days: 1
