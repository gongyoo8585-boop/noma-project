name: Inspect NORA365 Source Before Full Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate Secrets
        run: |
          test -n "${{ secrets.HOST }}"
          test -n "${{ secrets.USERNAME }}"
          test -n "${{ secrets.SSH_KEY }}"
          test -n "${{ secrets.PORT }}"
          test -n "${{ secrets.PROJECT_PATH }}"
      - name: Inspect latest production source
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT }}
          script_stop: false
          command_timeout: 15m
          script: |
            cd "${{ secrets.PROJECT_PATH }}" || exit 1
            echo "PROJECT=$(pwd)"
            echo "GIT_HEAD=$(git rev-parse HEAD 2>/dev/null || true)"
            echo "--- GIT STATUS ---"
            git status --short 2>/dev/null | sed -n '1,120p' || true
            echo "--- SOURCE FILES ---"
            for f in \
              client/src/pages/HomePage.jsx \
              client/src/pages/MapPage.jsx \
              client/src/pages/KaraokeMapPage.jsx \
              client/src/pages/ShopDetailPage.jsx \
              client/src/pages/KaraokeShopDetailPage.jsx \
              client/src/pages/JobsPage.jsx \
              client/src/pages/LoginPage.jsx \
              client/src/pages/SignupAgreePage.jsx \
              client/src/pages/SignupPage.jsx \
              client/src/pages/BusinessSignupAgreePage.jsx \
              client/src/pages/BusinessSignupPage.jsx \
              client/src/router/AppRouter.jsx \
              client/src/services/shop.api.js \
              client/src/services/user.api.js \
              client/src/services/job.api.js \
              client/src/pages/admin/ShopAdminPage.jsx \
              client/src/pages/admin/UserAdminPage.jsx \
              client/src/pages/admin/karaoke/KaraokeUserAdminPage.jsx \
              server.js \
              package.json \
              client/package.json; do
              if [ -f "$f" ]; then
                printf '%s|' "$f"
                stat -c '%y|%s|' "$f"
                sha256sum "$f" | awk '{print $1}'
              else
                echo "$f|MISSING"
              fi
            done
            echo "--- ROUTES ---"
            grep -nE 'path=.*(login|signup-agree|signup|business/signup-agree|admin|jobs|karaoke|map)' client/src/router/AppRouter.jsx 2>/dev/null | sed -n '1,120p' || true
            echo "--- KEY MARKERS ---"
            grep -nE 'smallMobilePopupScale|scrollToMobilePageHeader|전체 채용정보|businessSignupAgreeChecked|agreeBoxChecked|agreeBox' client/src/pages/HomePage.jsx client/src/pages/MapPage.jsx client/src/pages/KaraokeMapPage.jsx client/src/pages/JobsPage.jsx client/src/pages/BusinessSignupAgreePage.jsx 2>/dev/null | sed -n '1,160p' || true
            exit 0
