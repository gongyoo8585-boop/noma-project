name: Inspect NORA Images

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate Secrets
        run: |
          test -n "${{ secrets.HOST }}"
          test -n "${{ secrets.USERNAME }}"
          test -n "${{ secrets.SSH_KEY }}"
          test -n "${{ secrets.PORT }}"
          test -n "${{ secrets.PROJECT_PATH }}"
      - name: Inspect image payload hashes
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT }}
          script_stop: false
          command_timeout: 10m
          script: |
            cd "${{ secrets.PROJECT_PATH }}"
            python3 - <<'PY'
            from pathlib import Path
            import re, hashlib
            files = [
              'client/src/pages/HomePage.jsx',
              'client/src/pages/LoginPage.jsx',
              'client/src/pages/SignupPage.jsx',
              'client/src/pages/SignupAgreePage.jsx',
              'client/src/pages/MapPage.jsx',
              'client/src/pages/KaraokeMapPage.jsx'
            ]
            for f in files:
              p=Path(f)
              if not p.exists():
                print('MISSING', f); continue
              s=p.read_text(errors='ignore')
              found=[]
              found.extend(re.findall(r'data:image/[^;]+;base64,[A-Za-z0-9+/=]+', s))
              for m in re.finditer(r'const\s+(\w+)\s*=\s*\n?\s*"(data:image/[^;]+;base64,)"\s*\+(.+?);', s, re.S):
                var,prefix,body=m.groups(); parts=re.findall(r'"([A-Za-z0-9+/=]+)"', body); found.append(prefix+''.join(parts))
              print('FILE', f)
              for x in found:
                print(len(x), hashlib.sha256(x.encode()).hexdigest())
            PY
