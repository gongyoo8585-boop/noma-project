name: Deploy NORA365 Current Bundle Patch

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: nora-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate Secrets
        run: |
          test -n "${{ secrets.HOST }}"
          test -n "${{ secrets.USERNAME }}"
          test -n "${{ secrets.SSH_KEY }}"
          test -n "${{ secrets.PORT }}"
      - name: Patch and deploy current NORA365 bundle
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT }}
          script_stop: false
          command_timeout: 20m
          script: |
            set -e
            LIVE_ROOT=/var/www/nora
            OLD_JS="$LIVE_ROOT/assets/index-7w4aX4Nn.js"
            NEW_JS="$LIVE_ROOT/assets/index-NORA365-20260915.js"
            INDEX="$LIVE_ROOT/index.html"
            EXPECTED_OLD_SHA="5ca77faaff2a63887376dbe12ed54196559a61ae5680ebea88f1e388362c8f09"
            EXPECTED_NEW_SHA="47ae5635aa42bc5b396b062469c57325c6c20dfb04da4563141d929b768ba8f7"

            echo "=== VERIFY CURRENT LIVE BUNDLE ==="
            test -f "$OLD_JS"
            test -f "$INDEX"
            CURRENT_SHA=$(sha256sum "$OLD_JS" | awk '{print $1}')
            echo "CURRENT_SHA=$CURRENT_SHA"
            if [ "$CURRENT_SHA" != "$EXPECTED_OLD_SHA" ] && [ ! -f "$NEW_JS" ]; then
              echo "Unexpected current bundle hash; refusing unsafe patch"
              exit 1
            fi

            echo "=== BACKUP LIVE DIST ==="
            TS=$(date +%Y%m%d-%H%M%S)
            sudo mkdir -p "/var/backups/nora/$TS"
            sudo cp -a "$INDEX" "/var/backups/nora/$TS/index.html"
            if [ -f "$OLD_JS" ]; then sudo cp -a "$OLD_JS" "/var/backups/nora/$TS/index-7w4aX4Nn.js"; fi

            echo "=== BUILD PATCHED BUNDLE ==="
            if [ ! -f "$NEW_JS" ] || [ "$(sha256sum "$NEW_JS" | awk '{print $1}')" != "$EXPECTED_NEW_SHA" ]; then
              sudo cp "$OLD_JS" "$NEW_JS"
              cat > /tmp/nora_patch_business_agree.py <<'PY'
            from pathlib import Path
            import base64
            p=Path('/var/www/nora/assets/index-NORA365-20260915.js')
            s=p.read_text(encoding='utf-8')
            start=s.index('function ox(){')
            end=s.index('lx="#F7D774"', start)
            replacement=base64.b64decode('').decode('utf-8')
            p.write_text(s[:start]+replacement+s[end:], encoding='utf-8')
            PY
              sudo python3 /tmp/nora_patch_business_agree.py
              rm -f /tmp/nora_patch_business_agree.py
            fi

            echo "=== VERIFY PATCHED BUNDLE ==="
            node --check "$NEW_JS"
            NEW_SHA=$(sha256sum "$NEW_JS" | awk '{print $1}')
            echo "NEW_SHA=$NEW_SHA"
            test "$NEW_SHA" = "$EXPECTED_NEW_SHA"
            grep -q '업체 회원가입 약관동의' "$NEW_JS"
            grep -q 'linear-gradient(#15130b, #15130b) padding-box' "$NEW_JS"

            echo "=== SWITCH INDEX TO NEW BUNDLE ==="
            sudo sed -i 's#index-7w4aX4Nn\.js#index-NORA365-20260915.js#g' "$INDEX"
            grep -q 'index-NORA365-20260915.js' "$INDEX"

            echo "=== RESTART API / RELOAD NGINX ==="
            if pm2 describe nora-api > /dev/null 2>&1; then
              pm2 restart nora-api --update-env
              pm2 save
            fi
            sudo nginx -t
            sudo systemctl reload nginx

            echo "=== HEALTH CHECK ==="
            curl -f --max-time 30 https://api.nora365.co.kr/api/health
            curl -f --max-time 30 https://www.nora365.co.kr
            curl -f --max-time 30 https://www.nora365.co.kr/business/signup-agree
            curl -f --max-time 30 https://www.nora365.co.kr/assets/index-NORA365-20260915.js -o /tmp/nora-live.js
            test "$(sha256sum /tmp/nora-live.js | awk '{print $1}')" = "$EXPECTED_NEW_SHA"
            curl -f --max-time 30 https://m.nora365.co.kr || true
            rm -f /tmp/nora-live.js

            echo "NORA365 DEPLOY SUCCESS"
