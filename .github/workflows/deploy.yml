name: Deploy NORA365 Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Deploy production
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT }}
          script_stop: true
          command_timeout: 25m
          script: |
            set -e
            cd "${{ secrets.PROJECT_PATH }}"
            bash deploy/deploy.sh

      - name: Verify public routes
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT }}
          script_stop: true
          command_timeout: 10m
          script: |
            set -e
            curl -fsS --max-time 30 http://127.0.0.1:10000/api/health
            curl -fsS --max-time 30 https://api.nora365.co.kr/api/health
            for url in \
              https://www.nora365.co.kr/ \
              https://www.nora365.co.kr/home \
              https://www.nora365.co.kr/map \
              https://www.nora365.co.kr/massage/map \
              https://www.nora365.co.kr/karaoke \
              https://www.nora365.co.kr/karaoke/map \
              https://www.nora365.co.kr/jobs \
              https://www.nora365.co.kr/login \
              https://www.nora365.co.kr/signup-agree \
              https://www.nora365.co.kr/signup \
              https://www.nora365.co.kr/business/signup-agree \
              https://www.nora365.co.kr/business/signup \
              https://www.nora365.co.kr/admin \
              https://www.nora365.co.kr/admin/dashboard; do
              code=$(curl -L -sS -o /dev/null -w '%{http_code}' --max-time 30 "$url")
              echo "$code $url"
              test "$code" = "200"
            done
            code=$(curl -L -sS -o /dev/null -w '%{http_code}' --max-time 30 https://m.nora365.co.kr)
            echo "MOBILE_HTTP=$code"
            test "$code" = "200"
            echo "NORA365 FULL DEPLOY SUCCESS"
