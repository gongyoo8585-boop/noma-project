name: Locate Latest NORA365 Source

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  locate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate Secrets
        run: |
          test -n "${{ secrets.HOST }}"
          test -n "${{ secrets.USERNAME }}"
          test -n "${{ secrets.SSH_KEY }}"
          test -n "${{ secrets.PORT }}"
      - name: Locate latest NORA365 project files
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT }}
          script_stop: false
          command_timeout: 15m
          script: |
            echo "=== PROJECT CANDIDATES ==="
            find /home -maxdepth 5 -type f \( -name 'JobsPage.jsx' -o -name 'BusinessSignupAgreePage.jsx' -o -name 'HomePage.jsx' \) -printf '%TY-%Tm-%Td %TH:%TM:%TS %s %p\n' 2>/dev/null | sort -r | sed -n '1,200p'
            echo "=== NORA PROJECT DIRS ==="
            find /home -maxdepth 4 -type d \( -name 'noma-project' -o -name 'nora-project' -o -name 'client' \) -print 2>/dev/null | sed -n '1,120p'
            echo "=== VAR WWW ==="
            find /var/www -maxdepth 4 -type f -name 'index.html' -printf '%TY-%Tm-%Td %TH:%TM:%TS %s %p\n' 2>/dev/null | sort -r | sed -n '1,80p'
            exit 0
