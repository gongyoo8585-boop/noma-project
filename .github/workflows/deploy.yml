name: Verify NORA365 Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: nora-production-verify
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate Secrets
        run: |
          test -n "${{ secrets.HOST }}"
          test -n "${{ secrets.USERNAME }}"
          test -n "${{ secrets.SSH_KEY }}"
          test -n "${{ secrets.PORT }}"
      - name: Verify NORA365 production
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT }}
          script_stop: false
          command_timeout: 15m
          script: |
            set -e
            LIVE_ROOT=/var/www/nora
            JS="$LIVE_ROOT/assets/index-NORA365-20260915.js"
            INDEX="$LIVE_ROOT/index.html"
            EXPECTED_SHA="47ae5635aa42bc5b396b062469c57325c6c20dfb04da4563141d929b768ba8f7"

            echo "=== STATIC BUNDLE VERIFY ==="
            test -f "$INDEX"
            test -f "$JS"
            grep -q 'index-NORA365-20260915.js' "$INDEX"
            node --check "$JS"
            ACTUAL_SHA=$(sha256sum "$JS" | awk '{print $1}')
            echo "ACTUAL_SHA=$ACTUAL_SHA"
            test "$ACTUAL_SHA" = "$EXPECTED_SHA"
            grep -q '업체 회원가입 약관동의' "$JS"
            grep -q 'linear-gradient(#15130b, #15130b) padding-box' "$JS"

            echo "=== PM2 VERIFY ==="
            pm2 describe nora-api
            STATUS=$(pm2 jlist | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>{const a=JSON.parse(s).find(x=>x.name==="nora-api");console.log(a&&a.pm2_env?a.pm2_env.status:"")})')
            echo "PM2_STATUS=$STATUS"
            test "$STATUS" = "online"

            echo "=== NGINX VERIFY ==="
            sudo nginx -t

            echo "=== LOCAL API HEALTH ==="
            ok=0
            for i in 1 2 3 4 5 6; do
              if curl -fsS --max-time 20 http://127.0.0.1:10000/api/health; then ok=1; break; fi
              echo "local health retry $i"
              sleep 5
            done
            test "$ok" = "1"

            echo "=== PUBLIC API HEALTH ==="
            ok=0
            for i in 1 2 3 4 5 6; do
              if curl -fsS --max-time 20 https://api.nora365.co.kr/api/health; then ok=1; break; fi
              echo "public api retry $i"
              sleep 5
            done
            test "$ok" = "1"

            echo "=== PUBLIC WEB VERIFY ==="
            curl -fsS --max-time 30 https://www.nora365.co.kr >/tmp/nora-home.html
            curl -fsS --max-time 30 https://www.nora365.co.kr/business/signup-agree >/tmp/nora-signup.html
            curl -fsS --max-time 60 https://www.nora365.co.kr/assets/index-NORA365-20260915.js >/tmp/nora-live.js
            test "$(sha256sum /tmp/nora-live.js | awk '{print $1}')" = "$EXPECTED_SHA"
            if curl -fsS --max-time 30 https://m.nora365.co.kr >/tmp/nora-mobile.html; then
              echo "MOBILE_DOMAIN=OK"
            else
              echo "MOBILE_DOMAIN=UNAVAILABLE_OR_NOT_SEPARATE"
            fi
            rm -f /tmp/nora-home.html /tmp/nora-signup.html /tmp/nora-live.js /tmp/nora-mobile.html
            echo "NORA365 PRODUCTION VERIFY SUCCESS"
