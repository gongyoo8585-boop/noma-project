name: Inspect NORA Live Dist

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate Secrets
        run: |
          test -n "${{ secrets.HOST }}"
          test -n "${{ secrets.USERNAME }}"
          test -n "${{ secrets.SSH_KEY }}"
          test -n "${{ secrets.PORT }}"
      - name: Inspect live dist
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT }}
          script_stop: false
          command_timeout: 10m
          script: |
            echo "--- LIVE DIST ---"
            ls -lah /var/www/nora || true
            ls -lah /var/www/nora/assets || true
            sha256sum /var/www/nora/index.html /var/www/nora/assets/*.js 2>/dev/null || true
            echo "--- INDEX ASSET ---"
            grep -o 'assets/index-[^" ]*\.js' /var/www/nora/index.html 2>/dev/null || true
            echo "--- ROUTE/FEATURE STRINGS ---"
            grep -l -E 'business/signup-agree|BusinessSignupAgree|전체 채용정보|PartnerInquiry|가입 유형|업체 회원가입' /var/www/nora/assets/*.js 2>/dev/null || true
            echo "--- DIST MTIME ---"
            stat /var/www/nora/index.html /var/www/nora/assets/*.js 2>/dev/null | grep -E 'File:|Modify:' || true
            exit 0
