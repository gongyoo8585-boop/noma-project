name: Locate Latest NORA365 Source

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  locate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate Secrets
        run: |
          test -n "${{ secrets.HOST }}"
          test -n "${{ secrets.USERNAME }}"
          test -n "${{ secrets.SSH_KEY }}"
          test -n "${{ secrets.PORT }}"
      - name: Locate latest NORA365 project files
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT }}
          script_stop: false
          command_timeout: 15m
          script: |
            echo "=== KEY FILE LOCATIONS ==="
            find /home -maxdepth 9 -type f \( -name 'JobsPage.jsx' -o -name 'BusinessSignupAgreePage.jsx' -o -name 'HomePage.jsx' -o -name 'MapPage.jsx' -o -name 'KaraokeMapPage.jsx' \) -printf '%TY-%Tm-%Td %TH:%TM:%TS|%s|%p\n' 2>/dev/null | sort -r | sed -n '1,240p'
            echo "=== CURRENT PROJECT PAGES ==="
            for d in /home/*/noma-project /home/*/noma-project-backup-20260824-110541 /home/*/noma-deploy-stage-20260824; do
              if [ -d "$d/client/src/pages" ]; then
                echo "DIR=$d"
                ls -lah --time-style=long-iso "$d/client/src/pages" | grep -E 'HomePage|MapPage|KaraokeMapPage|JobsPage|LoginPage|SignupPage|SignupAgreePage|BusinessSignupPage|BusinessSignupAgreePage' || true
              fi
            done
            exit 0
